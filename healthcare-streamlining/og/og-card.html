<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>OG card: the lean clinic</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700&family=Hanken+Grotesk:wght@300;400;600&display=swap" rel="stylesheet">
<!-- Social preview card, 1200 x 630, following BRAND.md section 12 (number first):
     tag chip, one giant Lime figure on the brand glow, caption of 12 words or fewer,
     cell strip as proof, logo and consilium.ng in the footer.
     Render: msedge --headless --screenshot=og-image.png --window-size=1200,630 og-card.html -->
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1200px;height:630px;overflow:hidden;background:#123184;font-family:'Hanken Grotesk',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.card{position:relative;width:1200px;height:630px;background:#123184;overflow:hidden;color:#fff}
.g{position:absolute;border-radius:50%;filter:blur(40px)}
.g1{left:560px;top:-330px;width:1100px;height:760px;background:radial-gradient(closest-side,rgba(61,53,235,1),rgba(61,53,235,0));opacity:1}
.g2{left:620px;top:260px;width:1000px;height:640px;background:radial-gradient(closest-side,rgba(44,177,244,1),rgba(44,177,244,0));opacity:.9}
.g3{left:-330px;top:380px;width:760px;height:520px;background:radial-gradient(closest-side,rgba(200,245,160,.55),rgba(200,245,160,0));opacity:1}
.title{position:absolute;left:70px;top:48px;font-family:'Fraunces',Georgia,serif;font-optical-sizing:auto;font-weight:700;font-size:84px;line-height:1;letter-spacing:-.02em;color:#fff;white-space:nowrap}
.chip{position:absolute;right:72px;top:64px;height:40px;padding:0 20px;border:2px solid rgba(255,255,255,.5);border-radius:20px;display:flex;align-items:center;font-size:16px;font-weight:600;letter-spacing:.14em;text-transform:uppercase}
.fig{position:absolute;left:66px;top:140px;font-size:184px;font-weight:300;letter-spacing:-.045em;line-height:1;color:#C8F5A0;font-variant-numeric:tabular-nums}
.cap{position:absolute;left:72px;top:334px;width:1080px;white-space:nowrap;font-size:34px;line-height:1.3;color:rgba(255,255,255,.92)}
.cells{position:absolute;left:72px;top:432px;display:flex;gap:9px}
.cell{position:relative;width:60px;height:60px;border-radius:15px;background:rgba(255,255,255,.26)}
.cell i{position:absolute;left:0;top:0;bottom:0;background:#C8F5A0;border-radius:15px 0 0 15px}
.cell i.full{border-radius:15px}
.ring{position:absolute;inset:-6px;border:2.5px dashed #fff;border-radius:19px}
.note{position:absolute;top:500px;transform:translateX(-50%);font-size:19px;font-weight:600;color:#fff;white-space:nowrap}
.foot{position:absolute;left:72px;right:72px;bottom:44px;display:flex;align-items:center;justify-content:space-between}
.foot img{height:38px;display:block}
.foot span{font-size:26px;font-weight:600}
</style></head>
<body><div class="card">
<div class="g g1"></div><div class="g g2"></div><div class="g g3"></div>
<div class="title">The lean clinic</div>
<div class="chip">Nigeria · 2026</div>
<div class="fig">14</div>
<div class="cap">Patients a day: where a lean clinic starts to earn more.</div>
<div class="cells" id="cells"></div>
<div class="foot"><img src="../../assets/consilium-logo-white.png" alt="Consilium"><span>consilium.ng</span></div>
</div>
<script>
// 20 cells = the 20 patients a day in the model baseline; 14 lit = break-even volume.
var el=document.getElementById('cells');
for(var i=0;i<20;i++){var c=document.createElement('div');c.className='cell';c.style.width='38px';c.style.height='38px';c.style.borderRadius='10px';
  if(i<14){var f=document.createElement('i');f.className='full';f.style.width='100%';f.style.borderRadius='10px';c.appendChild(f)}
  el.appendChild(c)}
</script></body></html>
